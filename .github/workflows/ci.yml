name: CI
on:
  push:
    branches:
      - master
  pull_request:

# Only run on the latest ref
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The engine is a path dependency one directory up from the workspace
# (`quickjs-oxide = { path = "../../quickjs-oxide" }`), so both repositories are checked
# out side by side inside the runner's workspace. Nothing else has to be installed: the
# tree has no C dependency, so there is no clang, no cmake and no pkg-config step.
jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: Xmas.JS
      - name: Check out the engine next door
        uses: actions/checkout@v7
        with:
          repository: 0xfe-project/quickjs-oxide
          path: quickjs-oxide
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test
        working-directory: Xmas.JS
        run: cargo test --workspace

  targets:
    name: every target compiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: Xmas.JS
      - name: Check out the engine next door
        uses: actions/checkout@v7
        with:
          repository: 0xfe-project/quickjs-oxide
          path: quickjs-oxide
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Add the targets we ship
        run: rustup target add aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
      - name: Check every target
        working-directory: Xmas.JS
        run: ./scripts/check-targets.sh
