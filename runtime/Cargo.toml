[package]
name = "xmas-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "JavaScript engine embedding layer: realm driver, host services and compile"

[features]
default = ["sqlite"]
# xmas:sqlite, the interface of bun:sqlite on FrankenSQLite (pure Rust).
sqlite = ["dep:fsqlite"]

[dependencies]
fsqlite = { version = "=0.5.1", optional = true, default-features = false, features = ["native", "json", "fts5"] }
# The package manager is a module here (src/package), not a crate: an import that names a package
# nobody installed asks it for one (src/deps.rs) with a plain function call.
# The engine is a git dependency, pinned to a rev: the embedder-owned ArrayBuffer entry this
# runtime needs (new_array_buffer_over) is on that branch, not on a published tag.
quickjs-oxide = { git = "https://github.com/0xfe-project/quickjs-oxide", rev = "2939cf20d85152edbea57873fe1743629f40871f" }
# The wasm engine: a WebAssembly 1.0 interpreter/JIT, and what WebAssembly.* runs on.
wnjr-core = { workspace = true }
smol = "2"
futures-lite = "2"
socket2 = { version = "0.6", features = ["all"] }
url = { version = "2", features = ["serde"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.3"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
memchr = "2"
# Reading a package's entry out of its package.json, which is the one thing resolution needs JSON for.
serde_json = "1"
# Temporal is the language's own date API; the crate is the one V8, Boa and Kiesel use. No default
# features: sys-local would read the host's zone, and the compiled tzdb is what this runtime wants.
temporal_rs = { version = "0.2.6", default-features = false, features = ["compiled_data"] }
trillium = "1.4"
trillium-http = "1.8"
trillium-client = "0.9.21"
trillium-smol = "0.7"
trillium-rustls = { version = "0.11", default-features = false, features = ["client", "custom-crypto-provider", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
oxc = { version = "^0.103.0", default-features = false, features = [
    "transformer",
    "codegen",
    "semantic",
    "ast_visit",
] }

# --- the package manager (src/package) -------------------------------------------------------
# It used to be a crate with its own manifest. What is left of its dependency list is below;
# the HTTP stack, smol, flate2, serde_json and the TLS crates above are already the ones it uses.
# Nothing here needs clap: the binary owns the only parser.
tracing = "0.1.40"
async-lock = "3"
tar = "0.4"
base64 = "0.22"
itertools = "0.14.0"
color-eyre = "0.6.3"
compact_str = { version = "0.9.0", features = ["serde"] }
dashmap = { version = "6.0.0", features = ["serde"] }
indexmap = { version = "2.2.6", features = ["serde"] }
indicatif = "0.18.0"
multimap = "0.10.0"
node-semver = { git = "https://github.com/danielhuang/node-semver-rs", rev = "bf4b103dc88b310c9dc049433aff1a14716e1e68" }
notify = "=8.2.0"
rustc-hash = "2.0.0"
serde = { version = "1.0.200", features = ["derive", "rc"] }
serde_path_to_error = "0.1.16"
toml = "0.9.0"
rand = "0.8.5"
which = "8.0.0"
owo-colors = "4.2.3"

# Cloning a package directory into node_modules in one call. See `package::plan::place_dir`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Directory links on windows: there is no symlink without a privilege, so a junction stands in.
[target.'cfg(windows)'.dependencies]
junction = "1.3.0"
