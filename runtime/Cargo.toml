[package]
name = "xmas-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "JavaScript engine embedding layer: realm driver, host services and compile"

[dependencies]
# The package manager is a library as well as a CLI: an import that names a package nobody
# installed asks it for one (src/deps.rs).
xmas-package-manager = { workspace = true }
quickjs-oxide = { path = "../../quickjs-oxide" }
quickjs-oxide-host = { path = "../../quickjs-oxide/adapters/native" }
smol = "2"
futures-lite = "2"
socket2 = { version = "0.6", features = ["all"] }
url = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.3"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
memchr = "2"
# Reading a package's entry out of its package.json, which is the one thing resolution needs JSON for.
serde_json = "1"
# Temporal is the language's own date API; the crate is the one V8, Boa and Kiesel use. No default
# features: sys-local would read the host's zone, and the compiled tzdb is what this runtime wants.
temporal_rs = { version = "0.2.6", default-features = false, features = ["compiled_data"] }
trillium = "1.4"
trillium-http = "1.8"
trillium-client = "0.9.21"
trillium-smol = "0.7"
trillium-rustls = { version = "0.11", default-features = false, features = ["client", "custom-crypto-provider", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
oxc = { version = "^0.103.0", default-features = false, features = [
    "transformer",
    "codegen",
    "semantic",
] }
