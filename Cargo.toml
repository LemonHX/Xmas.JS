[package]
name = "xmas"
version = "0.10.0"
authors = ["LemonHX <lemonhx@lemonhx.moe>"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "WinterTC compatible ECMAScript/TypeScript runtime"

[workspace]
members = [
  "runtime",
  "package-manager",
]
# The runtime is what we are building; the package manager still pulls tokio,
# so keep it out of the default build.
default-members = ["runtime"]

[workspace.dependencies]
xmas-package-manager = { path = "package-manager" }

[dependencies]
xmas-package-manager = { workspace = true }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
compact_str = { version = "0.9.0", features = ["serde"] }
node-semver = { git = "https://github.com/danielhuang/node-semver-rs", rev = "bf4b103dc88b310c9dc049433aff1a14716e1e68" }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
